baseURL = 'https://ozkanpakdil.github.io/usa-stocks-indicator/'
languageCode = 'en-us'
title = 'Public Company Stocks Indicator'
theme = ["github.com/adityatelange/hugo-PaperMod"]

[params]
  description = 'Tracking public company events like government awards and layoffs, and their impact on stocks.'
  showFullTextContent = true
  hideFooter = true

  [params.profileMode]
    enabled = true
    title = 'Public Company Stocks Indicator'
    subtitle = 'Tracking public company events (Awards, Layoffs) and their stock impact.'
    [[params.profileMode.buttons]]
        name = "📉 Layoffs Indicator"
        url = "tags/layoffs"
    [[params.profileMode.buttons]]
        name = "🏆 Awards Indicator"
        url = "tags/awards"
    [[params.profileMode.buttons]]
        name = "📂 Archive"
        url = "archives"
    [[params.profileMode.buttons]]
        name = "📝 Recent Reports"
        url = "posts"

[outputs]
  home = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = true

[[menu.main]]
    name = "Archive"
    url = "archives"
    weight = 10
