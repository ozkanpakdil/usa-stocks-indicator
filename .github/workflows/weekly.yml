name: Weekly Awards Update

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday midnight
  workflow_dispatch: # Allow manual run

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # bun install does not run playwright's postinstall script, so the
      # chromium browser must be downloaded explicitly or chromium.launch()
      # fails in CI and the scraper silently falls back to stale data.
      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Run crawler (awards + layoffs)
        run: |
          bun run index.ts
          bun run layoffs.ts

      # Secondary indicators: one failing source must not block the rest
      # or the site deploy; a failed step shows as red in Actions.
      - name: Insider buys
        continue-on-error: true
        run: bun run insiders.ts

      - name: Cyber 8-K disclosures
        continue-on-error: true
        run: bun run cyber8k.ts

      - name: Buyback announcements
        continue-on-error: true
        run: bun run buybacks.ts

      - name: M&A announcements
        continue-on-error: true
        run: bun run mna.ts

      - name: Distress & bankruptcy filings
        continue-on-error: true
        run: bun run bankrupt.ts

      - name: FDA approvals
        continue-on-error: true
        run: bun run fda.ts

      - name: Product recalls
        continue-on-error: true
        run: bun run recalls.ts

      - name: Congressional trades
        continue-on-error: true
        run: bun run congress.ts

      - name: 13F fund holdings
        continue-on-error: true
        run: bun run thirteenf.ts

      - name: Earnings surprises
        continue-on-error: true
        run: bun run earnings.ts

      - name: Market dashboard
        continue-on-error: true
        run: bun run breadth.ts

      - name: Commit and push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add *.json content/ go.mod go.sum
          git commit -m "Weekly report update: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          # Rebase first: main may have moved while this job was crawling
          # (a concurrent push would otherwise make the push below fail).
          git pull --rebase origin main
          git push

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build with Hugo
        run: |
          hugo mod tidy
          hugo \
            --gc \
            --minify \
            --baseURL "https://ozkanpakdil.github.io/usa-stocks-indicator/"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
